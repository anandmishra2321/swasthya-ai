version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/swasthya
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-at-least-32-chars
      JWT_REFRESH_SECRET: change-me-too-in-production-32-chars
      FRONTEND_ORIGIN: http://localhost:5173
      AI_PROVIDER: mock
      EMAIL_PROVIDER: mock
      SEED_ON_START: 'true'
    ports:
      - '5000:5000'
  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'
volumes:
  mongo_data: